# Pruebas en cada push y PR; solo un push a main despliega. GitHub asume el rol
# diseno-github-deploy por OIDC (deploy/infra.yaml): no hay llaves de AWS guardadas.
# El humo se prueba dentro de la instancia (deploy.sh), no por CloudFront: el WAF
# compartido le pone CAPTCHA a las IP de los runners.
# Las acciones van fijadas al commit (la versión, en el comentario): una etiqueta
# se puede mover y el trabajo de despliegue corre con el rol de AWS.
name: ci-cd

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scripts de despliegue
        run: |
          for script in deploy/bootstrap.sh deploy/release.sh deploy/instance/deploy.sh deploy/instance/backup.sh; do
            bash -n "$script"
          done
          shellcheck deploy/bootstrap.sh deploy/release.sh deploy/instance/deploy.sh deploy/instance/backup.sh
          python3 -c "import ast; ast.parse(open('deploy/instance/smoke.py').read())"
      - name: Compose de producción
        env:
          POSTGRES_PASSWORD: solo-validacion
          SESSION_SECRET: solo-validacion-012345678901234567890123
          ADMIN_PASSWORD: solo-validacion
          APP_IMAGE: diseno:validacion
          S3_BUCKET: diseno-validacion
          ORIGIN_DOMAIN: design-origin.example.com
          ORIGIN_SECRET: solo-validacion-012345678901234567890123
        run: docker compose -f deploy/compose.prod.yml config --quiet
      - name: Configuración de Caddy
        run: |
          docker run --rm \
            -e ORIGIN_DOMAIN=design-origin.example.com \
            -e ORIGIN_SECRET=solo-validacion-012345678901234567890123 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Docker Hub: los runners agotan el límite anónimo de ECR Public.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: diseno
          POSTGRES_PASSWORD: solo-ci
          POSTGRES_DB: diseno
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U diseno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          sin_formato="$(gofmt -l .)"
          if [ -n "$sin_formato" ]; then
            echo "Falta gofmt en:"
            echo "$sin_formato"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
        env:
          DATABASE_URL: postgres://diseno:solo-ci@localhost:5432/diseno?sslmode=disable

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::113380982662:role/diseno-github-deploy
          aws-region: us-east-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # buildx corre en un paso run y necesita las variables del caché de Actions,
      # que GitHub solo les pasa a las acciones de JavaScript.
      - name: Caché de Actions para buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const k of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[k]) core.exportVariable(k, process.env[k])
            }
      - name: Imagen y despliegue
        env:
          BUILD_CACHE: --cache-from type=gha --cache-to type=gha,mode=max,ignore-error=true
        run: TAG="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" deploy/release.sh
