# Producción en la instancia (/opt/diseno/compose.yml). Los valores salen de
# /opt/diseno/.env, que escribe deploy.sh con los parámetros de /diseno/prod/.
name: diseno

services:
  db:
    image: public.ecr.aws/docker/library/postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diseno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: diseno
    volumes:
      # Postgres 18 guarda los datos en /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U diseno -d diseno]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  app:
    image: ${APP_IMAGE:?falta APP_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://diseno:${POSTGRES_PASSWORD}@db:5432/diseno?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET}
      PUBLIC_URL: https://design.nexed.dev
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:?falta S3_BUCKET}
      S3_PREFIX: media/
      AWS_REGION: us-east-1
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # SDK del WAF compartido (su URL de integración); mantiene vivo el token del navegador.
      WAF_SDK_URL: https://d7033e2e59b9.edge.sdk.awswaf.com/d7033e2e59b9/b75dc5bf6c71/challenge.js
    healthcheck:
      test: [CMD, /app/server, -healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: public.ecr.aws/docker/library/caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      ORIGIN_DOMAIN: ${ORIGIN_DOMAIN:?falta ORIGIN_DOMAIN}
      ORIGIN_SECRET: ${ORIGIN_SECRET:?falta ORIGIN_SECRET}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
