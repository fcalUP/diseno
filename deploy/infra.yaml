# Infraestructura de diseno (design.nexed.dev) en una sola pila: una EC2 arm64
# con Docker Compose (Caddy, app y Postgres) detrás de CloudFront con el WAF
# compartido, medios en S3 bajo /media/*, imágenes en ECR y el rol de GitHub
# Actions. Va en la VPC por defecto, aparte de las VPC de Portal.
# Se aplica con deploy/bootstrap.sh; tiene que vivir en us-east-1 (CloudFront y ACM).
AWSTemplateFormatVersion: '2010-09-09'
Description: diseno - EC2 con Docker Compose detras de CloudFront y el WAF compartido; medios en S3.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-07a9d9ca49e59006d
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0d1729f1112b00b8c
  InstanceType:
    Type: String
    Default: t4g.small
  # CloudFormation vuelve a resolver este parámetro en cada actualización y un
  # AMI distinto reemplaza la instancia. bootstrap.sh pasa /diseno/ami (fijo).
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z05855492X3YNEAVPY8XU
  DomainName:
    Type: String
    Default: design.nexed.dev
  OriginDomainName:
    Type: String
    Default: design-origin.nexed.dev
  # WAF compartido de la cuenta: se asocia a la distribución y no se toca.
  WebAclArn:
    Type: String
    Default: arn:aws:wafv2:us-east-1:113380982662:global/webacl/CreatedByAmplify-dhy2h4c81wipm-235d8144-b7dd-4ec9-bee5-8a12d53571e6/71455744-6408-43e2-836e-6827a5fb3b5e
  GitHubRepo:
    Type: String
    Default: fcalUP/diseno
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  # GitHub puede firmar el sub con los ids numéricos (repo:dueño@id/repo@id:...).
  # Se aceptan los dos formatos para que un cambio en GitHub no corte el despliegue.
  GitHubRepoWithIds:
    Type: String
    Default: fcalUP@54124933/diseno@989247551
    AllowedPattern: '^[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+$'
  OidcProviderArn:
    Type: String
    Default: arn:aws:iam::113380982662:oidc-provider/token.actions.githubusercontent.com

Resources:
  # Medios (media/), respaldos (backups/) y paquetes de despliegue (deploy/).
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub diseno-media-${AWS::AccountId}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: versiones-anteriores
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
          - Id: respaldos
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 35
          - Id: paquetes-de-despliegue
            Status: Enabled
            Prefix: deploy/
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          # El panel sube las imágenes directo a S3 con un PUT firmado. x-amz-*
          # por si el SDK firma también una suma de verificación.
          - AllowedOrigins: [!Sub 'https://${DomainName}']
            AllowedMethods: [PUT]
            AllowedHeaders: [content-type, x-amz-*]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Solo esta distribución lee, y solo media/.
          - Sid: CloudFrontLeeMedios
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/media/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: SoloTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: diseno
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules": [{"rulePriority": 1,
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 15},
          "action": {"type": "expire"}}]}

  # Sin SSH: se entra con Session Manager. El 80 queda abierto para el reto
  # HTTP-01 de Let's Encrypt; al 443 solo llega CloudFront.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: diseno - 80 para ACME, 443 solo desde CloudFront
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: ACME HTTP-01}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: '::/0', Description: ACME HTTP-01}
        # com.amazonaws.global.cloudfront.origin-facing
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, SourcePrefixListId: pl-3b927c52, Description: CloudFront}
      Tags: [{Key: Name, Value: diseno}]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: diseno-ec2
      Description: Instancia de diseno, la app en sus contenedores y el despliegue por SSM.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: diseno-instancia
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*'}
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt Repository.Arn
              # Subidas del panel: la app firma el PUT y luego revisa que el objeto exista.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${Bucket.Arn}/media/u/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: [!Sub '${Bucket.Arn}/media/*', !Sub '${Bucket.Arn}/deploy/*']
              - Effect: Allow
                # Sin condición de prefijo: S3 solo responde 404 (y no 403) a un HeadObject
                # de algo que no existe cuando el rol puede listar el bucket.
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${Bucket.Arn}/backups/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/diseno/prod'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/diseno/prod/*'
              # AmazonSSMManagedInstanceCore deja leer cualquier parámetro de la
              # cuenta; esta instancia solo debe ver los suyos.
              - Effect: Deny
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath, ssm:GetParameterHistory]
                NotResource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/diseno/prod'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/diseno/prod/*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition: {StringEquals: {kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'}}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: diseno-ec2
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      DisableApiTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        # Dos saltos: los contenedores (red bridge) usan el rol de la instancia.
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      PropagateTagsToVolumeOnCreation: true
      Tags: [{Key: Name, Value: diseno}]
      # Solo corre en el primer arranque. Las versiones las instala deploy.sh por SSM.
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker
          mkdir -p /etc/docker
          # El driver local rota los registros de los contenedores.
          echo '{"log-driver": "local"}' > /etc/docker/daemon.json
          systemctl enable --now docker

          plugin=/usr/local/lib/docker/cli-plugins/docker-compose
          mkdir -p "$(dirname "$plugin")"
          curl -fsSL --retry 5 --retry-all-errors -o "$plugin" \
            https://github.com/docker/compose/releases/download/v5.8.0/docker-compose-linux-aarch64
          echo "1a9c918b2fb49b9c87f0018c64b5abd0d30715155e98dc939779fbaee6c414d3  $plugin" | sha256sum -c -
          chmod 755 "$plugin"

          # 1 GB de swap: la t4g.small trae 2 GB de RAM.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=1024
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap defaults 0 0' >> /etc/fstab
          fi

          mkdir -p /opt/diseno
          chmod 700 /opt/diseno

          # Respaldo diario; no hace nada hasta que deploy.sh deja backup.sh.
          cat > /etc/systemd/system/diseno-backup.service <<'EOF'
          [Unit]
          Description=Respaldo de Postgres de diseno a S3
          ConditionPathExists=/opt/diseno/backup.sh
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          ExecStart=/bin/bash /opt/diseno/backup.sh
          EOF
          cat > /etc/systemd/system/diseno-backup.timer <<'EOF'
          [Unit]
          Description=Respaldo diario de diseno

          [Timer]
          OnCalendar=*-*-* 09:00:00 UTC
          Persistent=true

          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now diseno-backup.timer

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: diseno}]

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  # Si AWS detecta una falla de hardware, mueve la instancia a otro host con el mismo disco.
  RecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: diseno-recuperar-instancia
      AlarmDescription: Recupera la EC2 de diseno cuando falla la comprobacion de sistema.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{Name: InstanceId, Value: !Ref Instance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Sub 'arn:aws:automate:${AWS::Region}:ec2:recover']

  # Nombre del origen para CloudFront y para el certificado de Caddy.
  OriginRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginDomainName
      Type: A
      TTL: '300'
      ResourceRecords: [!GetAtt ElasticIp.PublicIp]

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - {DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}

  MediaOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: diseno-media
        Description: CloudFront lee media/ del bucket de diseno
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Lo que la app necesita del visitante; Host no va, así llega el del origen.
  AppOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: diseno-app
        Comment: Cookies, query strings y los encabezados que usa la app de diseno
        CookiesConfig: {CookieBehavior: all}
        QueryStringsConfig: {QueryStringBehavior: all}
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Origin
            - Referer
            - User-Agent
            - Accept
            - Accept-Language
            - Content-Type
            - CloudFront-Viewer-Address
            - CloudFront-Viewer-Country

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: diseno - app en EC2 y medios en S3, con el WAF compartido
        Enabled: true
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        WebACLId: !Ref WebAclArn
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: app
            DomainName: !Ref OriginDomainName
            # Caddy rechaza con 403 lo que no traiga este encabezado.
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: '{{resolve:ssm:/diseno/prod/ORIGIN_SECRET}}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
          - Id: media
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt MediaOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        # API y páginas: sin caché.
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: !Ref AppOriginRequestPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          Compress: true
        CacheBehaviors:
          # Assets de Vite con hash en el nombre.
          - PathPattern: /assets/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            Compress: true
          - PathPattern: /media/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            Compress: true
        # CloudFront guarda los errores 10 s por defecto; así cada error de la
        # API llega fresco del origen.
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 414, ErrorCachingMinTTL: 0}
          - {ErrorCode: 416, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 501, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}

  SiteRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # zona fija de CloudFront

  SiteRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # GitHub Actions de la rama main, por OIDC: sin llaves guardadas en GitHub.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: diseno-github-deploy
      Description: GitHub Actions de diseno, rama main.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref OidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubRepoWithIds}:ref:refs/heads/main'
      Policies:
        - PolicyName: diseno-despliegue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Sesión en ECR y en ECR Public (de ahí salen las imágenes base; como
              # anónimos, los runners topan con el límite de descargas).
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken, ecr-public:GetAuthorizationToken, sts:GetServiceBearerToken]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer,
                  ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: [!Sub '${Bucket.Arn}/deploy/*', !Sub '${Bucket.Arn}/media/legacy/*']
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition: {StringLike: {s3:prefix: [deploy/*, media/legacy/*]}}
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}'
              # No admite permisos por recurso. ListCommandInvocations no va: con
              # --details mostraría la salida de los comandos de otros proyectos.
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'

Outputs:
  InstanceId:
    Value: !Ref Instance
  BucketName:
    Value: !Ref Bucket
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  OriginDomainName:
    Value: !Ref OriginDomainName
